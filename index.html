<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NovaOS — Mobile Operating System Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            nova: {
              blue: '#3B82F6',
              accent: '#60A5FA',
              surface: '#0B0F17',
              card: '#131926',
            }
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070B;
      font-family: 'Inter', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input[type="range"] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 0;
      width: 0;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "framer-motion": "https://esm.sh/framer-motion@11.3.28?deps=react@18.3.1",
        "lucide-react": "https://esm.sh/lucide-react@0.427.0?deps=react@18.3.1"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useRef, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence, useReducedMotion } from 'framer-motion';
    import * as Lucide from 'lucide-react';

    const h = React.createElement;

    // =========================================================================
    // ERROR BOUNDARY (PREVENTS FULL-SCREEN BLACKOUTS)
    // =========================================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: '' };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || 'Unexpected rendering error' };
      }
      render() {
        if (this.state.hasError) {
          return h('div', { className: 'h-full w-full bg-[#0B0F17] text-white flex flex-col items-center justify-center p-6 text-center gap-3' },
            h('div', { className: 'text-sm font-semibold text-blue-400' }, 'NovaOS Recovery'),
            h('p', { className: 'text-xs text-slate-400 max-w-[260px]' }, this.state.message),
            h('button', {
              type: 'button',
              onClick: () => {
                this.setState({ hasError: false, message: '' });
                if (this.props.onReset) this.props.onReset();
              },
              className: 'px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold'
            }, 'Reload View')
          );
        }
        return this.props.children;
      }
    }

    // =========================================================================
    // 1. SYSTEM CONSTANTS & WALLPAPER HELPERS (DARK + LIGHT VARIANTS)
    // =========================================================================
    const PRESET_WALLPAPERS = [
      {
        id: 'obsidian-horizon',
        name: 'Horizon',
        type: 'css',
        darkValue: 'radial-gradient(circle at 20% 20%, #172554 0%, #090D16 45%, #030508 100%)',
        lightValue: 'radial-gradient(circle at 20% 20%, #BFDBFE 0%, #EFF6FF 50%, #DBEAFE 100%)',
        accent: '#3B82F6'
      },
      {
        id: 'arctic-slate',
        name: 'Slate',
        type: 'css',
        darkValue: 'linear-gradient(155deg, #0F172A 0%, #1E293B 48%, #090D16 100%)',
        lightValue: 'linear-gradient(155deg, #F8FAFC 0%, #E2E8F0 52%, #CBD5E1 100%)',
        accent: '#2563EB'
      },
      {
        id: 'midnight-cobalt',
        name: 'Cobalt',
        type: 'css',
        darkValue: 'radial-gradient(ellipse at 80% 10%, #1D4ED8 0%, #0F172A 40%, #050811 100%)',
        lightValue: 'radial-gradient(ellipse at 80% 10%, #93C5FD 0%, #F0F9FF 48%, #E0F2FE 100%)',
        accent: '#0284C7'
      },
      {
        id: 'titanium-mist',
        name: 'Mist',
        type: 'css',
        darkValue: 'linear-gradient(160deg, #1E293B 0%, #0F172A 55%, #020617 100%)',
        lightValue: 'linear-gradient(160deg, #FFFFFF 0%, #F1F5F9 55%, #E2E8F0 100%)',
        accent: '#3B82F6'
      }
    ];

    function resolveWallpaper(wpId, customWallpapers) {
      const custom = customWallpapers.find(w => w.id === wpId);
      if (custom) return custom;
      return PRESET_WALLPAPERS.find(w => w.id === wpId) || PRESET_WALLPAPERS[0];
    }

    function getWallpaperSurfaceStyle(wp, isDark = true) {
      if (!wp) return {};
      if (wp.type === 'image') {
        return {
          backgroundImage: `url("${wp.value}")`,
          backgroundSize: 'cover',
          backgroundPosition: 'center',
          backgroundRepeat: 'no-repeat'
        };
      }
      return { background: isDark ? wp.darkValue : wp.lightValue };
    }

    const APPS_CONFIG = [
      { id: 'nova-ai', name: 'Nova AI', icon: 'Sparkles', bg: 'from-blue-600 to-indigo-900', dock: true },
      { id: 'phone', name: 'Phone', icon: 'Phone', bg: 'from-emerald-500 to-teal-700', dock: true },
      { id: 'messages', name: 'Messages', icon: 'MessageSquare', bg: 'from-sky-500 to-blue-700', dock: true },
      { id: 'browser', name: 'Browser', icon: 'Compass', bg: 'from-blue-500 to-cyan-700', dock: true },
      { id: 'settings', name: 'Settings', icon: 'Settings', bg: 'from-slate-600 to-slate-800', dock: false },
      { id: 'camera', name: 'Camera', icon: 'Camera', bg: 'from-zinc-700 to-neutral-900', dock: false },
      { id: 'photos', name: 'Photos', icon: 'Image', bg: 'from-amber-500 to-orange-600', dock: false },
      { id: 'clock', name: 'Clock', icon: 'Clock', bg: 'from-slate-800 to-black', dock: false },
      { id: 'calendar', name: 'Calendar', icon: 'Calendar', bg: 'from-rose-500 to-red-700', dock: false },
      { id: 'calculator', name: 'Calculator', icon: 'Calculator', bg: 'from-neutral-700 to-stone-900', dock: false },
      { id: 'weather', name: 'Weather', icon: 'CloudSun', bg: 'from-blue-400 to-indigo-600', dock: false },
      { id: 'notes', name: 'Notes', icon: 'FileText', bg: 'from-amber-400 to-yellow-600', dock: false },
      { id: 'music', name: 'Music', icon: 'Music', bg: 'from-indigo-500 to-purple-700', dock: false },
      { id: 'files', name: 'Files', icon: 'Folder', bg: 'from-blue-600 to-slate-800', dock: false },
    ];

    const SPRING_TRANSITION = { type: 'spring', stiffness: 380, damping: 32, mass: 0.9 };
    const FAST_SPRING = { type: 'spring', stiffness: 500, damping: 35 };
    const SAMSUNG_UNLOCK_SPRING = { type: 'spring', stiffness: 290, damping: 28, mass: 0.95 };

    // =========================================================================
    // 2. PERSISTENT STORAGE HOOK
    // =========================================================================
    function usePersistentState(key, defaultValue) {
      const [state, setState] = useState(() => {
        try {
          const item = localStorage.getItem(`novaos_${key}`);
          if (item) return JSON.parse(item);
          return typeof defaultValue === 'function' ? defaultValue() : defaultValue;
        } catch {
          return typeof defaultValue === 'function' ? defaultValue() : defaultValue;
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem(`novaos_${key}`, JSON.stringify(state));
        } catch (e) {
          console.warn('Storage quota exceeded', e);
        }
      }, [key, state]);

      return [state, setState];
    }

    // =========================================================================
    // 3. CUSTOM VIRTUAL KEYBOARD (SYSTEM-WIDE ACROSS ALL APPS)
    // =========================================================================
    const KEYBOARD_ROWS = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['SHIFT', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACK'],
      ['123', 'SPACE', 'RETURN']
    ];

    const NUM_ROWS = [
      ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
      ['-', '/', ':', ';', '(', ')', '$', '&', '@', '"'],
      ['ABC', '.', ',', '?', '!', "'", 'BACK'],
      ['ABC', 'SPACE', 'RETURN']
    ];

    function NovaVirtualKeyboard({ isDark, onKeyPress, onBackspace, onSubmit, onHide }) {
      const [shifted, setShifted] = useState(true);
      const [numeric, setNumeric] = useState(false);

      const rows = numeric ? NUM_ROWS : KEYBOARD_ROWS;

      const handleKey = (k) => {
        if (k === 'SHIFT') {
          setShifted(s => !s);
        } else if (k === '123') {
          setNumeric(true);
        } else if (k === 'ABC') {
          setNumeric(false);
        } else if (k === 'BACK') {
          onBackspace();
        } else if (k === 'SPACE') {
          onKeyPress(' ');
        } else if (k === 'RETURN') {
          if (onSubmit) onSubmit();
          else onKeyPress('\n');
        } else {
          const char = (!numeric && shifted) ? k.toUpperCase() : k.toLowerCase();
          onKeyPress(char);
          if (!numeric && shifted) setShifted(false);
        }
      };

      return h(motion.div, {
        initial: { y: '100%' },
        animate: { y: 0 },
        exit: { y: '100%' },
        transition: SPRING_TRANSITION,
        className: `w-full backdrop-blur-xl border-t px-1.5 pt-1.5 pb-1 select-none shrink-0 z-30 ${
          isDark
            ? 'bg-[#090D16]/95 border-blue-500/20 text-white'
            : 'bg-slate-200/95 border-slate-300 text-slate-900'
        }`
      },
        onHide && h('div', { className: 'flex justify-between items-center px-2 pb-1 text-[10px] opacity-60' },
          h('span', { className: 'font-mono text-blue-500 font-semibold' }, 'NOVA KEYBOARD'),
          h('button', { type: 'button', onClick: onHide, className: 'flex items-center gap-0.5 hover:opacity-100' },
            h(Lucide.ChevronDown, { size: 13 }), 'Hide'
          )
        ),
        rows.map((row, rIdx) =>
          h('div', { key: rIdx, className: 'flex justify-center gap-1 mb-1' },
            row.map((key) => {
              const isSpecial = ['SHIFT', 'BACK', '123', 'ABC', 'RETURN'].includes(key);
              const isSpace = key === 'SPACE';
              return h(motion.button, {
                key,
                type: 'button',
                whileTap: { scale: 0.92 },
                onClick: () => handleKey(key),
                className: `h-8 rounded-lg text-[12px] font-medium flex items-center justify-center transition-colors ${
                  isSpace
                    ? (isDark ? 'flex-1 max-w-[165px] bg-slate-800/90 text-slate-200 border border-white/10' : 'flex-1 max-w-[165px] bg-white text-slate-800 border border-slate-300 shadow-2xs')
                    : key === 'RETURN'
                      ? 'px-3 bg-blue-600 text-white font-semibold shadow-sm shadow-blue-500/30'
                      : isSpecial
                        ? (isDark ? 'px-2 bg-slate-800/80 text-blue-400 border border-blue-500/20' : 'px-2 bg-slate-300/90 text-blue-700 border border-slate-400/40')
                        : (isDark ? 'flex-1 max-w-[33px] bg-slate-900/90 text-white border border-white/10' : 'flex-1 max-w-[33px] bg-white text-slate-900 border border-slate-300 shadow-2xs')
                }`
              },
                key === 'BACK' ? h(Lucide.Delete, { size: 14 }) :
                key === 'SHIFT' ? h(Lucide.ArrowUp, { size: 14, className: shifted ? 'text-blue-500' : 'opacity-45' }) :
                key === 'SPACE' ? 'space' :
                key === 'RETURN' ? (onSubmit ? 'Send' : '↵') :
                (!numeric && shifted ? key.toUpperCase() : key.toLowerCase())
              );
            })
          )
        )
      );
    }

    // =========================================================================
    // 4. CUSTOM APP ICON COMPONENT
    // =========================================================================
    function AppIcon({ app, onOpen, size = 'md', showLabel = true, isDark = true }) {
      const IconComp = Lucide[app.icon] || Lucide.Box;
      const dims = size === 'sm' ? 'w-11 h-11 rounded-[13px]' : 'w-[58px] h-[58px] rounded-[17px]';
      const iconSize = size === 'sm' ? 20 : 26;

      return h(motion.button, {
        whileHover: { scale: 1.05 },
        whileTap: { scale: 0.9 },
        transition: FAST_SPRING,
        onClick: () => onOpen(app.id),
        className: 'flex flex-col items-center gap-1.5 group focus:outline-none'
      },
        h('div', {
          className: `${dims} bg-gradient-to-br ${app.bg} relative flex items-center justify-center shadow-lg shadow-black/25 border border-white/20 overflow-hidden`
        },
          h('div', { className: 'absolute inset-0 bg-gradient-to-b from-white/25 to-transparent opacity-60 pointer-events-none' }),
          app.id === 'nova-ai' && h('div', { className: 'absolute inset-0 ring-1 ring-inset ring-blue-300/60 rounded-[17px]' }),
          h(IconComp, { size: iconSize, className: 'text-white relative z-10 drop-shadow-sm', strokeWidth: 1.8 })
        ),
        showLabel && h('span', {
          className: `text-[11px] font-medium tracking-tight truncate max-w-[66px] ${
            isDark
              ? 'text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.9)]'
              : 'text-slate-900 drop-shadow-[0_1px_2px_rgba(255,255,255,0.85)]'
          }`
        }, app.name)
      );
    }

    // =========================================================================
    // 5. STATUS BAR COMPONENT
    // =========================================================================
    function StatusBar({ timeStr, battery, isDark, onOpenControlCenter, powerState }) {
      const textColor = powerState === 'aod'
        ? 'text-neutral-500'
        : (isDark || powerState === 'locked' ? 'text-white' : 'text-slate-900');

      return h('div', {
        onClick: () => powerState === 'unlocked' && onOpenControlCenter(),
        style: { paddingTop: 'max(10px, env(safe-area-inset-top))' },
        className: `w-full px-5 pb-2 flex items-center justify-between text-[13px] font-semibold tracking-tight z-40 cursor-pointer select-none transition-colors duration-300 ${textColor}`
      },
        h('div', { className: 'flex items-center gap-1.5' },
          h('span', null, timeStr)
        ),
        h('div', { className: 'flex items-center gap-1.5' },
          h('span', { className: 'text-[11px] font-medium opacity-90' }, `${battery}%`),
          h('div', { className: 'relative flex items-center' },
            h('div', {
              className: `w-[23px] h-[11.5px] rounded-[3.5px] border p-[1.5px] flex items-center ${
                powerState === 'aod' ? 'border-neutral-600' : (isDark || powerState === 'locked' ? 'border-white/75' : 'border-slate-900/75')
              }`
            },
              h('div', {
                style: { width: `${battery}%` },
                className: `h-full rounded-[1.5px] transition-all duration-500 ${
                  battery <= 20 ? 'bg-red-500' : (powerState === 'aod' ? 'bg-neutral-500' : (isDark || powerState === 'locked' ? 'bg-white' : 'bg-slate-900'))
                }`
              })
            ),
            h('div', {
              className: `w-[1.5px] h-[4px] rounded-r-full ml-[1px] ${
                powerState === 'aod' ? 'bg-neutral-600' : (isDark || powerState === 'locked' ? 'bg-white/75' : 'bg-slate-900/75')
              }`
            })
          )
        )
      );
    }

    // =========================================================================
    // 6. HOME BAR WITH 3-GESTURE ENGINE
    // =========================================================================
    function HomeBar({ activeApp, onSingleTap, onDoubleTap, onLongPress, isDark }) {
      const [expanded, setExpanded] = useState(false);
      const tapCountRef = useRef(0);
      const singleTapTimerRef = useRef(null);
      const longPressTimerRef = useRef(null);
      const longPressTriggeredRef = useRef(false);

      const handlePointerDown = (e) => {
        e.stopPropagation();
        longPressTriggeredRef.current = false;

        longPressTimerRef.current = setTimeout(() => {
          longPressTriggeredRef.current = true;
          tapCountRef.current = 0;
          if (singleTapTimerRef.current) clearTimeout(singleTapTimerRef.current);
          onLongPress();
        }, 420);
      };

      const handlePointerUp = (e) => {
        e.stopPropagation();
        if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
          longPressTimerRef.current = null;
        }

        if (longPressTriggeredRef.current) return;

        tapCountRef.current += 1;

        if (tapCountRef.current === 1) {
          singleTapTimerRef.current = setTimeout(() => {
            tapCountRef.current = 0;
            if (!activeApp) {
              setExpanded(true);
              setTimeout(() => setExpanded(false), 450);
            }
            onSingleTap();
          }, 250);
        } else if (tapCountRef.current >= 2) {
          if (singleTapTimerRef.current) clearTimeout(singleTapTimerRef.current);
          tapCountRef.current = 0;
          onDoubleTap();
        }
      };

      const handlePointerCancel = () => {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
      };

      return h('div', {
        style: { paddingBottom: 'max(8px, env(safe-area-inset-bottom))' },
        className: 'w-full pt-2 flex flex-col items-center justify-end z-50 relative shrink-0'
      },
        h('div', {
          onPointerDown: handlePointerDown,
          onPointerUp: handlePointerUp,
          onPointerCancel: handlePointerCancel,
          title: 'Tap: Home • Double Tap: Nova AI • Hold: Multitasking',
          className: 'px-8 py-2 cursor-pointer flex items-center justify-center group'
        },
          h(motion.div, {
            animate: {
              width: expanded ? 150 : 112,
              backgroundColor: expanded
                ? '#3B82F6'
                : (isDark ? 'rgba(255, 255, 255, 0.85)' : 'rgba(15, 23, 42, 0.75)'),
              boxShadow: expanded ? '0 0 14px rgba(59, 130, 246, 0.85)' : '0 0 0px rgba(59, 130, 246, 0)'
            },
            transition: { type: 'spring', stiffness: 450, damping: 28 },
            className: 'h-[4px] rounded-full'
          })
        )
      );
    }

    // =========================================================================
    // 7. NOVA AI ASSISTANT (MULTI-CHAT + NEW CHAT ON LAUNCH + PRESS & HOLD DELETE)
    // =========================================================================
    function createFreshNovaChat() {
      return {
        id: `chat-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
        title: 'New Chat',
        createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        messages: [
          {
            id: `init-${Date.now()}`,
            role: 'assistant',
            text: 'Nova AI ready in Demo Mode. Ask anything or command system settings.'
          }
        ]
      };
    }

    function NovaAIApp({ systemState, onToggleSetting, onOpenApp, launchCount }) {
      const isDark = systemState.isDark;

      const [chats, setChats] = usePersistentState('nova_ai_chats_v2', () => [createFreshNovaChat()]);
      const [currentChatId, setCurrentChatId] = useState(() => chats[0]?.id || null);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [longPressedChatId, setLongPressedChatId] = useState(null);
      const [input, setInput] = useState('');
      const [isThinking, setIsThinking] = useState(false);
      const [showKeyboard, setShowKeyboard] = useState(true);

      const holdTimerRef = useRef(null);
      const holdTriggeredRef = useRef(false);
      const chatEndRef = useRef(null);
      const mountedRef = useRef(false);

      // Start a brand-new chat every time Nova AI launches/reopens
      useEffect(() => {
        if (!mountedRef.current) {
          mountedRef.current = true;
          return;
        }
        const fresh = createFreshNovaChat();
        setChats(prev => [fresh, ...prev]);
        setCurrentChatId(fresh.id);
        setDrawerOpen(false);
        setLongPressedChatId(null);
      }, [launchCount]);

      const activeChat = chats.find(c => c.id === currentChatId) || chats[0] || null;

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [activeChat?.messages?.length, isThinking]);

      const generateDemoResponse = (prompt) => {
        const q = prompt.toLowerCase();
        if (q.includes('light mode') || q.includes('dark mode') || q.includes('theme')) {
          onToggleSetting('isDark');
          return `Switched interface appearance to ${!isDark ? 'Dark' : 'Light'} Mode.`;
        }
        if (q.includes('wifi') || q.includes('wi-fi')) {
          onToggleSetting('wifi');
          return `Wi-Fi is now ${!systemState.wifi ? 'enabled' : 'disabled'}.`;
        }
        if (q.includes('battery') || q.includes('status')) {
          return `Battery at ${systemState.battery}%, Brightness at ${systemState.brightness}%, Wi-Fi ${systemState.wifi ? 'On' : 'Off'}.`;
        }
        if (q.includes('weather')) {
          return 'Current sample weather: 21°C and Partly Cloudy. Open Weather for the 5-day forecast.';
        }
        if (q.includes('open ')) {
          const target = APPS_CONFIG.find(a => q.includes(a.name.toLowerCase()));
          if (target && target.id !== 'nova-ai') {
            setTimeout(() => onOpenApp(target.id), 600);
            return `Opening ${target.name}...`;
          }
        }
        return `[Demo Mode] Response to "${prompt}". Connect a Gemini API backend for live model responses.`;
      };

      const handleSend = () => {
        const trimmed = input.trim();
        if (!trimmed || isThinking) return;

        const targetId = activeChat?.id;
        if (!targetId) return;

        const userMsg = { id: `${Date.now()}-u`, role: 'user', text: trimmed };

        setChats(prev => prev.map(c => {
          if (c.id !== targetId) return c;
          const nextTitle = c.title === 'New Chat' ? trimmed.slice(0, 28) : c.title;
          return { ...c, title: nextTitle, messages: [...c.messages, userMsg] };
        }));

        setInput('');
        setIsThinking(true);

        setTimeout(() => {
          const replyText = generateDemoResponse(trimmed);
          const aiMsg = { id: `${Date.now()}-a`, role: 'assistant', text: replyText };
          setChats(prev => prev.map(c => c.id === targetId ? { ...c, messages: [...c.messages, aiMsg] } : c));
          setIsThinking(false);
        }, 700);
      };

      const handleDeleteChat = (chatId) => {
        setLongPressedChatId(null);
        setChats(prev => {
          const remaining = prev.filter(c => c.id !== chatId);
          if (remaining.length === 0) {
            const replacement = createFreshNovaChat();
            setCurrentChatId(replacement.id);
            return [replacement];
          }
          if (currentChatId === chatId) {
            setCurrentChatId(remaining[0].id);
          }
          return remaining;
        });
      };

      const startChatHold = (chatId) => {
        holdTriggeredRef.current = false;
        holdTimerRef.current = setTimeout(() => {
          holdTriggeredRef.current = true;
          setLongPressedChatId(chatId);
        }, 420);
      };

      const endChatHold = (chatId) => {

    function CalculatorApp({ isDark }) {
      const [display, setDisplay] = useState('0');
      const [prevVal, setPrevVal] = useState(null);
      const [op, setOp] = useState(null);
      const [resetNext, setResetNext] = useState(false);

      const handleNum = (n) => {
        if (resetNext) { setDisplay(n); setResetNext(false); }
        else setDisplay(display === '0' ? n : (display.length < 11 ? display + n : display));
      };

      const handleDot = () => {
        if (resetNext) { setDisplay('0.'); setResetNext(false); return; }
        if (!display.includes('.')) setDisplay(display + '.');
      };

      const compute = (a, b, operator) => {
        switch (operator) {
          case '+': return a + b;
          case '-': return a - b;
          case '×': return a * b;
          case '÷': return b === 0 ? 'Error' : a / b;
          default: return b;
        }
      };

      const handleOp = (nextOp) => {
        const current = parseFloat(display);
        if (prevVal === null) setPrevVal(current);
        else if (op) {
          const result = compute(prevVal, current, op);
          setDisplay(String(Number(result.toFixed(6))));
          setPrevVal(result === 'Error' ? null : result);
        }
        setOp(nextOp);
        setResetNext(true);
      };

      const handleEquals = () => {
        if (op === null || prevVal === null) return;
        const result = compute(prevVal, parseFloat(display), op);
        setDisplay(result === 'Error' ? 'Error' : String(Number(result.toFixed(6))));
        setPrevVal(null);
        setOp(null);
        setResetNext(true);
      };

      const clear = () => { setDisplay('0'); setPrevVal(null); setOp(null); setResetNext(false); };

      const buttons = [
        ['AC', '±', '%', '÷'],
        ['7', '8', '9', '×'],
        ['4', '5', '6', '-'],
        ['1', '2', '3', '+'],
        ['0', '.', '=']
      ];

      return h('div', { className: 'h-full flex flex-col justify-end px-4 pb-4' },
        h('div', { className: 'flex-1 flex flex-col justify-end items-end pb-5 px-2' },
          h('div', { className: 'text-xs opacity-50 h-5 font-mono' }, prevVal !== null ? `${prevVal} ${op || ''}` : ''),
          h('div', { className: 'text-5xl font-light tracking-tight truncate max-w-full' }, display)
        ),
        h('div', { className: 'grid grid-cols-4 gap-2.5' },
          buttons.flat().map(btn => {
            const isOp = ['÷', '×', '-', '+', '='].includes(btn);
            const isTop = ['AC', '±', '%'].includes(btn);
            const isZero = btn === '0';
            return h(motion.button, {
              key: btn,
              whileTap: { scale: 0.92 },
              onClick: () => {
                if (btn === 'AC') clear();
                else if (btn === '±') setDisplay(String(parseFloat(display) * -1));
                else if (btn === '%') setDisplay(String(parseFloat(display) / 100));
                else if (btn === '.') handleDot();
                else if (btn === '=') handleEquals();
                else if (isOp) handleOp(btn);
                else handleNum(btn);
              },
              className: `${isZero ? 'col-span-2 text-left pl-7' : 'aspect-square flex items-center justify-center'} rounded-full text-xl font-medium transition-colors ${
                isOp ? 'bg-blue-600 text-white' :
                isTop ? (isDark ? 'bg-slate-700 text-white' : 'bg-slate-200 text-slate-900') :
                (isDark ? 'bg-white/10 text-white' : 'bg-white border border-slate-200 text-slate-900')
              }`
            }, btn);
          })
        )
      );
    }

    function ClockApp({ isDark }) {
      const [tab, setTab] = useState('world');
      const [now, setNow] = useState(new Date());
      const [swRunning, setSwRunning] = useState(false);
      const [swMs, setSwMs] = useState(0);
      const [timerSec, setTimerSec] = useState(180);
      const [timerRunning, setTimerRunning] = useState(false);

      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(id);
      }, []);

      useEffect(() => {
        if (!swRunning) return;
        const id = setInterval(() => setSwMs(m => m + 50), 50);
        return () => clearInterval(id);
      }, [swRunning]);

      useEffect(() => {
        if (!timerRunning) return;
        const id = setInterval(() => {
          setTimerSec(s => {
            if (s <= 1) { setTimerRunning(false); return 0; }
            return s - 1;
          });
        }, 1000);
        return () => clearInterval(id);
      }, [timerRunning]);

      const cities = [
        { name: 'San Francisco', tz: 'America/Los_Angeles' },
        { name: 'New York', tz: 'America/New_York' },
        { name: 'London', tz: 'Europe/London' },
        { name: 'Tokyo', tz: 'Asia/Tokyo' }
      ];

      const fmtSw = (ms) => {
        const mins = Math.floor(ms / 60000);
        const secs = Math.floor((ms % 60000) / 1000);
        const cs = Math.floor((ms % 1000) / 10);
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
      };

      const fmtTimer = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

      return h('div', { className: 'h-full flex flex-col px-5 pt-2 pb-4' },
        h('div', { className: 'flex gap-1 p-1 rounded-xl bg-blue-500/10 mb-5' },
          ['world', 'stopwatch', 'timer'].map(t =>
            h('button', {
              key: t,
              onClick: () => setTab(t),
              className: `flex-1 py-1.5 rounded-lg text-xs font-semibold capitalize transition-all ${tab === t ? 'bg-blue-600 text-white shadow' : 'opacity-65'}`
            }, t)
          )
        ),

    function CameraApp() {
      const videoRef = useRef(null);
      const [hasStream, setHasStream] = useState(false);
      const [flash, setFlash] = useState(false);
      const [mode, setMode] = useState('PHOTO');

      useEffect(() => {
        let activeStream = null;
        if (navigator.mediaDevices?.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
              activeStream = stream;
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                setHasStream(true);
              }
            })
            .catch(() => setHasStream(false));
        }
        return () => activeStream?.getTracks().forEach(t => t.stop());
      }, []);

      const shutter = () => {
        setFlash(true);
        setTimeout(() => setFlash(false), 180);
      };

      return h('div', { className: 'h-full bg-black text-white flex flex-col justify-between relative overflow-hidden' },
        flash && h('div', { className: 'absolute inset-0 bg-white z-30 pointer-events-none' }),
        h('div', { className: 'flex-1 relative flex items-center justify-center overflow-hidden rounded-2xl mx-2 mt-1 bg-neutral-900' },

    function MusicApp() {
      const tracks = [
        { title: 'Orbital Drift', artist: 'Nova Soundscapes', freq: 220 },
        { title: 'Subsurface Blue', artist: 'Kiasmos Tribute', freq: 261.63 },
        { title: 'Glass Horizon', artist: 'Ambient Works', freq: 196 }
      ];
      const [idx, setIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [progress, setProgress] = useState(34);
      const audioCtxRef = useRef(null);
      const oscRef = useRef(null);

      useEffect(() => {
        if (playing) {
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            const ctx = new Ctx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = tracks[idx].freq;
            gain.gain.value = 0.04;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            audioCtxRef.current = ctx;
            oscRef.current = osc;
          } catch {}
        } else {
          oscRef.current?.stop();
          audioCtxRef.current?.close();
        }
        return () => {
          try { oscRef.current?.stop(); audioCtxRef.current?.close(); } catch {}
        };
      }, [playing, idx]);

      useEffect(() => {
        if (!playing) return;
        const id = setInterval(() => setProgress(p => (p >= 100 ? 0 : p + 0.5)), 500);
        return () => clearInterval(id);
      }, [playing]);

      const current = tracks[idx];

      return h('div', { className: 'h-full flex flex-col justify-between px-6 pt-4 pb-6' },
        h('div', { className: 'aspect-square w-full max-w-[230px] mx-auto rounded-3xl bg-gradient-to-br from-blue-600 via-indigo-700 to-slate-900 shadow-2xl flex items-center justify-center relative overflow-hidden' },
          h(Lucide.Disc3, { size: 72, className: `text-white/80 ${playing ? 'animate-spin' : ''}`, style: { animationDuration: '6s' } })

        h('div', { className: 'text-center space-y-1' },
          h('h2', { className: 'text-lg font-bold' }, current.title),

        ),
        h('div', { className: 'space-y-2' },
          h('div', { className: 'w-full h-1.5 bg-blue-500/20 rounded-full overflow-hidden' },
            h('div', { style: { width: `${progress}%` }, className: 'h-full bg-blue-500 transition-all' })
          )
        ),
        h('div', { className: 'flex items-center justify-center gap-7' },
          h('button', { onClick: () => setIdx((idx - 1 + tracks.length) % tracks.length) }, h(Lucide.SkipBack, { size: 24 })),
          h(motion.button, {
            whileTap: { scale: 0.9 },
            onClick: () => setPlaying(p => !p),
            className: 'w-14 h-14 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg'
          }, playing ? h(Lucide.Pause, { size: 24 }) : h(Lucide.Play, { size: 24, className: 'ml-0.5' })),
          h('button', { onClick: () => setIdx((idx + 1) % tracks.length) }, h(Lucide.SkipForward, { size: 24 }))
        )
      );
    }

              animate: { scale: 1, opacity: 1 },
              exit: { scale: 0.7, opacity: 0, y: -40 },
              transition: SPRING_TRANSITION,
              onClick: () => onSelectApp(app.id),
              className: `w-52 h-80 shrink-0 snap-center rounded-3xl border shadow-2xl flex flex-col justify-between p-4 cursor-pointer relative overflow-hidden ${
                isDark ? 'bg-[#111726] border-white/15 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`
            },
              h('div', { className: 'flex items-center justify-between' },
                h('div', { className: 'flex items-center gap-2' },
                  h('div', { className: `w-7 h-7 rounded-lg bg-gradient-to-br ${app.bg} flex items-center justify-center` },
                    h(IconComp, { size: 14, className: 'text-white' })
                  ),
                  h('span', { className: 'text-xs font-semibold' }, app.name)
                ),
                h('button', {
                  onClick: (e) => { e.stopPropagation(); onCloseApp(app.id); },
                  className: `w-6 h-6 rounded-full hover:bg-rose-500 hover:text-white flex items-center justify-center transition-colors ${isDark ? 'bg-white/10 text-white' : 'bg-slate-200 text-slate-700'}`
                }, h(Lucide.X, { size: 13 }))
              ),
              h('div', { className: `flex-1 my-3 rounded-2xl border flex flex-col items-center justify-center gap-2 ${isDark ? 'bg-white/5 border-white/5' : 'bg-slate-100 border-slate-200'}` },
                h(IconComp, { size: 36, className: 'text-blue-500/75' }),
                h('span', { className: 'text-[11px] opacity-50' }, 'Tap to resume')
              )
            );
          })
        ) : h('div', { className: 'text-center text-xs text-white/45 py-12' }, 'Open any app and hold the home bar to switch tasks.')
      );
    }

    // =========================================================================
    // 12. MAIN NOVAOS KERNEL SHELL
    // =========================================================================
    function NovaOS() {
      const prefersReducedMotion = useReducedMotion();

      const [systemState, setSystemState] = usePersistentState('system_v3', {
        isDark: true,
        homeWallpaper: 'obsidian-horizon',
        lockWallpaper: 'obsidian-horizon',
        brightness: 95,
        volume: 70,
        wifi: true,
        bluetooth: true,
        airplane: false,
        dnd: false,
        notificationsEnabled: true,
        battery: 88
      });

      const [customWallpapers, setCustomWallpapers] = useState([]);
      const [unlockAnimKey, setUnlockAnimKey] = useState(0);
      const [novaLaunchCount, setNovaLaunchCount] = useState(0);

      // 'unlocked' | 'locked' | 'aod'
      const [powerState, setPowerState] = useState('unlocked');
      const [activeApp, setActiveApp] = useState(null);
      const [openApps, setOpenApps] = useState(['nova-ai', 'weather']);
      const [controlCenterOpen, setControlCenterOpen] = useState(false);
      const [multitaskingOpen, setMultitaskingOpen] = useState(false);
      const [now, setNow] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', systemState.isDark);
      }, [systemState.isDark]);

      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      const dateStr = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
      const isDark = systemState.isDark;

      const homeWallpaper = resolveWallpaper(systemState.homeWallpaper, customWallpapers);
      const lockWallpaper = resolveWallpaper(systemState.lockWallpaper, customWallpapers);

      const handleApplyWallpaper = (wpId, surface) => {
        setSystemState(prev => ({
          ...prev,
          homeWallpaper: (surface === 'home' || surface === 'both') ? wpId : prev.homeWallpaper,
          lockWallpaper: (surface === 'lock' || surface === 'both') ? wpId : prev.lockWallpaper
        }));
      };

      const handleUploadWallpaper = (newWp, surface) => {
        setCustomWallpapers(prev => [newWp, ...prev]);
        handleApplyWallpaper(newWp.id, surface);
      };

      const handleUnlock = useCallback(() => {
        setPowerState('unlocked');
        setUnlockAnimKey(k => k + 1);
      }, []);

      const openApp = useCallback((appId) => {
        setMultitaskingOpen(false);
        setControlCenterOpen(false);
        setActiveApp(appId);
        setOpenApps(prev => [appId, ...prev.filter(id => id !== appId)]);
        if (appId === 'nova-ai') {
          setNovaLaunchCount(c => c + 1);
        }
      }, []);

      const closeAppToHome = useCallback(() => {
        if (multitaskingOpen) { setMultitaskingOpen(false); return; }
        if (controlCenterOpen) { setControlCenterOpen(false); return; }
        setActiveApp(null);
      }, [multitaskingOpen, controlCenterOpen]);

      const closeRecentApp = (appId) => {
        setOpenApps(prev => prev.filter(id => id !== appId));
        if (activeApp === appId) setActiveApp(null);
      };

      const renderActiveApp = () => {
        const props = {
          isDark,
          systemState,
          setSystemState,
          customWallpapers,
          onUploadWallpaper: handleUploadWallpaper,
          homeWallpaperId: systemState.homeWallpaper,
          lockWallpaperId: systemState.lockWallpaper,
          onApplyWallpaper: handleApplyWallpaper,
          onToggleSetting: k => setSystemState(s => ({ ...s, [k]: !s[k] })),
          onOpenApp: openApp,
          launchCount: novaLaunchCount
        };
        switch (activeApp) {
          case 'nova-ai': return h(NovaAIApp, props);
          case 'settings': return h(SettingsApp, props);
          case 'calculator': return h(CalculatorApp, props);
          case 'clock': return h(ClockApp, props);
          case 'calendar': return h(CalendarApp, props);
          case 'notes': return h(NotesApp, props);
          case 'messages': return h(MessagesApp, props);
          case 'phone': return h(PhoneApp, props);
          case 'camera': return h(CameraApp, props);
          case 'photos': return h(PhotosApp, props);
          case 'weather': return h(WeatherApp, props);
          case 'music': return h(MusicApp, props);
          case 'files': return h(FilesApp, props);
          case 'browser': return h(BrowserApp, props);
          default: return null;
        }
      };

      const gridApps = APPS_CONFIG.filter(a => !a.dock);
      const dockApps = APPS_CONFIG.filter(a => a.dock);

      return h('div', {
        className: 'w-full h-full min-h-[100dvh] bg-[#05070B] flex items-center justify-center md:p-6 overflow-hidden'
      },
        h(ErrorBoundary, { onReset: () => setActiveApp(null) },
          h('div', {
            style: {
              ...getWallpaperSurfaceStyle(homeWallpaper, isDark),
              filter: `brightness(${0.35 + (systemState.brightness / 100) * 0.65})`
            },
            className: 'relative w-full h-[100dvh] md:w-[392px] md:h-[832px] md:max-h-[92vh] md:rounded-[48px] md:border-[8px] md:border-[#1B2230] md:shadow-[0_30px_90px_rgba(0,0,0,0.85),0_0_0_1px_rgba(255,255,255,0.08)] overflow-hidden flex flex-col justify-between transition-all duration-300'
          },

            powerState === 'unlocked' && h('div', {
              onClick: () => setControlCenterOpen(true),
              className: 'absolute top-0 inset-x-0 h-9 z-40 cursor-pointer'
            }),

            h(StatusBar, {
              timeStr,
              battery: systemState.battery,
              isDark,
              powerState,
              onOpenControlCenter: () => setControlCenterOpen(true)
            }),

            // HOME SCREEN LAYER WITH SAMSUNG-STYLE ZOOM-OUT UNLOCK
            h(motion.div, {
              key: `home-${unlockAnimKey}`,
              initial: prefersReducedMotion ? false : { scale: 1.13, opacity: 0.65 },
              animate: {
                scale: activeApp ? 0.94 : 1,
                opacity: activeApp ? 0.4 : 1
              },
              transition: prefersReducedMotion ? { duration: 0 } : SAMSUNG_UNLOCK_SPRING,
              className: 'flex-1 min-h-0 flex flex-col justify-between px-5 pt-4 pb-2 z-10 overflow-hidden origin-center'
            },
              h('div', {
                className: `pt-2 pb-4 px-1 ${isDark ? 'text-white' : 'text-slate-900'}`
              },
                h('div', { className: 'text-[54px] leading-none font-extralight tracking-tight' }, timeStr),
                h('div', { className: 'text-sm font-medium opacity-80 mt-1.5 flex items-center gap-2' },
                  h('span', null, dateStr),
                  h('span', { className: 'opacity-45' }, '•'),
                  h('span', { className: isDark ? 'text-blue-300' : 'text-blue-600 font-semibold' }, '21°C')
                )
              ),

              h(motion.div, {
                animate: { scale: activeApp ? 0.92 : 1, opacity: activeApp ? 0 : 1 },
                transition: prefersReducedMotion ? { duration: 0 } : SPRING_TRANSITION,
                className: 'grid grid-cols-4 gap-y-5 gap-x-2 my-auto'
              },
                gridApps.map(app => h(AppIcon, { key: app.id, app, onOpen: openApp, isDark }))
              ),

              h(motion.div, {
                animate: { y: activeApp ? 40 : 0, opacity: activeApp ? 0 : 1 },
                transition: prefersReducedMotion ? { duration: 0 } : SPRING_TRANSITION,
                className: `mt-3 px-3 py-3 rounded-[28px] backdrop-blur-2xl border flex items-center justify-around shadow-xl ${
                  isDark ? 'bg-black/25 border-white/15' : 'bg-white/60 border-white/70'
                }`
              },
                dockApps.map(app => h(AppIcon, { key: app.id, app, onOpen: openApp, showLabel: false, isDark }))
              )
            ),

            // ACTIVE APPLICATION WINDOW LAYER
            h(AnimatePresence, null,
              activeApp && h(motion.div, {
                key: activeApp,
                initial: { opacity: 0, scale: 0.88, y: 30, borderRadius: '36px' },
                animate: { opacity: 1, scale: 1, y: 0, borderRadius: '0px' },
                exit: { opacity: 0, scale: 0.88, y: 30, borderRadius: '36px' },
                transition: prefersReducedMotion ? { duration: 0.1 } : SPRING_TRANSITION,
                className: `absolute inset-0 pt-9 pb-9 z-20 flex flex-col min-h-0 overflow-hidden ${
                  activeApp === 'camera'
                    ? 'bg-black text-white'
                    : (isDark ? 'bg-[#0B0F17] text-white' : 'bg-[#F8FAFC] text-slate-900')
                }`
              },
                h(ErrorBoundary, { onReset: () => setActiveApp(null) },
                  renderActiveApp()
                )
              )
            ),

            // MULTITASKING SWITCHER
            h(AnimatePresence, null,
              multitaskingOpen && h(MultitaskingView, {
                openApps,
                onSelectApp: openApp,
                onCloseApp: closeRecentApp,
                onDismissSwitcher: () => setMultitaskingOpen(false),
                isDark
              })
            ),

            // CONTROL CENTER
            h(ControlCenter, {
              open: controlCenterOpen,
              onClose: () => setControlCenterOpen(false),
              systemState,
              setSystemState,
              onLockDevice: () => {
                setActiveApp(null);
                setMultitaskingOpen(false);
                setPowerState('aod');
              },
              onOpenSettings: () => openApp('settings')
            }),

            // LOCK SCREEN & ALWAYS-ON DISPLAY
            h(AnimatePresence, null,
              powerState !== 'unlocked' && h(LockAndAOD, {
                powerState,
                onWakeToLock: () => setPowerState('locked'),
                onUnlock: handleUnlock,
                timeStr,
                dateStr,
                battery: systemState.battery,
                lockWallpaper,
                isDark,
                notificationsEnabled: systemState.notificationsEnabled
              })
            ),

            // HOME BAR
            powerState === 'unlocked' && h(HomeBar, {
              activeApp,
              isDark,
              onSingleTap: closeAppToHome,
              onDoubleTap: () => openApp('nova-ai'),
              onLongPress: () => setMultitaskingOpen(m => !m)
            })
          )
        )
      );
    }

    createRoot(document.getElementById('root')).render(h(NovaOS));
  </script>
</body>
</html>
